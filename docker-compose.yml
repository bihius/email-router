services:
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # One-shot model download via Ollama HTTP API (no TTY / interactive CLI).
  ollama-pull:
    image: curlimages/curl:8.11.1
    depends_on:
      - ollama
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Ollama..."
        until curl -sf http://ollama:11434/api/tags >/dev/null; do sleep 2; done
        echo "Pulling $$OLLAMA_MODEL..."
        curl -sS http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"$$OLLAMA_MODEL\"}"
        echo
        echo "Pull finished."
    restart: "no"

  api:
    build: .
    ports:
      # Host 8001 — 8000 is often taken by other local stacks.
      - "8001:8000"
    env_file:
      - .env
    environment:
      # Inside the Compose network, talk to sibling services by name.
      SMTP_HOST: mailhog
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - mailhog
      - ollama

volumes:
  ollama_data:
