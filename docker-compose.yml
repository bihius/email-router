services:
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_NUM_CTX:-2048}
      GIN_MODE: release
      OLLAMA_DEBUG: ${OLLAMA_DEBUG:-0}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One-shot: official `ollama pull`, after the server answers.
  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:7b}"]
    tty: false
    stdin_open: false
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:-router@example.com}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
    depends_on:
      mailhog:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama_data:
