services:
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"

  ollama:
    image: ollama/ollama:0.34.4
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_NUM_CTX:-2048}
      OLLAMA_DEBUG: ${OLLAMA_DEBUG:-0}
      GIN_MODE: release
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One-shot: downloads the model weights, then exits. The API waits for it.
  ollama-pull:
    image: ollama/ollama:0.34.4
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen3:8b}"]

  # Optional decision engine. Started only with the "laya" profile (ROUTER_ENGINE=laya).
  laya:
    build: ./laya-serve
    profiles: ["laya"]
    volumes:
      - laya_models:/models

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ROUTER_ENGINE: ${ROUTER_ENGINE:-ollama}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:-router@example.com}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300}
      OLLAMA_THINK: "${OLLAMA_THINK:-}"
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      LAYA_URL: http://laya:8000
      LOG_LEVEL: ${LOG_LEVEL:-warning}
    depends_on:
      mailhog:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
      # Waits for Laya's checkpoint to load when the profile is on; ignored otherwise.
      laya:
        condition: service_healthy
        required: false

volumes:
  ollama_data:
  laya_models:
