services:
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # One-shot: download the default model after Ollama is up. First run can take a while.
  ollama-pull:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull llama3.2:1b"
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAIL_FROM: router@example.com
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
    depends_on:
      - mailhog
      - ollama

volumes:
  ollama_data:
