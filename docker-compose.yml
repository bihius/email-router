services:
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # One-shot: download the model from .env after Ollama is up. First run can take a while.
  ollama-pull:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull ${OLLAMA_MODEL}"
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the Compose network, talk to sibling services by name.
      SMTP_HOST: mailhog
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - mailhog
      - ollama

volumes:
  ollama_data:
